<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반별 러닝/걷기 누적 기록 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981; 
            --accent-hover: #059669;
            --border: #334155;
            --file-btn: #475569;
            --file-btn-hover: #64748b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        /* 입력 폼 카드 */
        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 14px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        select, input, .custom-file-upload {
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            height: 42px;
            display: flex;
            align-items: center;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            background-color: var(--file-btn);
            cursor: pointer;
            border: none;
            justify-content: center;
            font-weight: 500;
            transition: background 0.2s;
        }
        .custom-file-upload:hover {
            background-color: var(--file-btn-hover);
        }

        .preview-box {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: absolute;
            right: -50px;
            top: 25px;
            background: #000;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* [요청반영] '기록 등록하기' 버튼 스타일 변경: 입력 필드와 동일하게 */
        .submit-btn {
            background-color: #0f172a; /* 입력 필드와 동일 배경 */
            color: var(--text-main); /* 텍스트는 밝게 */
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border); /* 입력 필드와 동일 테두리 */
            border-radius: 8px;
            padding: 0 30px;
            height: 42px;
            font-size: 14px;
            transition: border-color 0.2s;
            grid-column: 1 / -1; /* 전체 너비 차지 */
            margin-top: 15px;
        }

        .submit-btn:hover {
            border-color: var(--accent); /* 입력 필드 포커스 효과와 동일하게 호버 */
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .preview-box {
                position: static;
                margin-top: 5px;
                width: 60px;
                height: 60px;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: #334155;
            font-size: 12px;
            font-weight: bold;
        }

        tr:nth-child(1) .rank-badge { background: #f59e0b; color: #0f172a; } 
        tr:nth-child(2) .rank-badge { background: #cbd5e1; color: #0f172a; } 
        tr:nth-child(3) .rank-badge { background: #b45309; color: #f8fafc; } 

        .action-btn {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .view-btn { background-color: #3b82f6; color: white; margin-right: 4px;}
        .view-btn:hover { background-color: #2563eb; }
        .delete-btn { background-color: #ef4444; color: white; }
        .delete-btn:hover { background-color: #dc2626; }

        .date-notice {
            font-size: 11px;
            color: #f43f5e;
            margin-top: 2px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        .modal-content img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            margin: 15px 0;
            background-color: #0f172a;
        }
        .close-modal {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .close-modal:hover { background-color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏃‍♂️ 학생 러닝/걷기 누적 기록 대시보드</h1>
        <p>집계 기간: 2026년 6월 8일 ~ 2026년 7월 10일</p>
    </header>

    <div class="form-card">
        <h3>📝 학생 기록 등록</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="student-grade">학년</label>
                <select id="student-grade">
                    <option value="1학년">1학년</option>
                    <option value="2학년">2학년</option>
                    <option value="3학년">3학년</option>
                </select>
            </div>
            <div class="form-group">
                <label for="student-class">반</label>
                <select id="student-class">
                    <option value="1반">1반</option>
                    <option value="2반">2반</option>
                    <option value="3반">3반</option>
                    <option value="4반">4반</option>
                </select>
            </div>
            <div class="form-group">
                <label for="student-name">이름</label>
                <input type="text" id="student-name" placeholder="홍길동">
            </div>
            <div class="form-group">
                <label for="run-date">날짜</label>
                <input type="date" id="run-date" min="2026-06-08" max="2026-07-10">
                <span id="date-warn" class="date-notice">기간 확인 요망</span>
            </div>
            <div class="form-group">
                <label for="run-distance">거리 (km)</label>
                <input type="number" id="run-distance" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group" style="margin-right: 40px; grid-column: span 1.5;"> 
                <label>증빙사진</label>
                <label for="proof-image" class="custom-file-upload" id="file-label">
                    📁 사진 선택
                </label>
                <input type="file" id="proof-image" accept="image/*" onchange="previewImage(this)">
                <div class="preview-box" id="input-preview-box">
                    <img id="input-preview-img" src="" alt="미리보기">
                </div>
            </div>
            
            <button class="submit-btn" onclick="addLog()" id="submit-btn-el">기록 등록하기</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>🏆 학년/반별 누적 거리 순위</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%">순위</th>
                        <th style="width: 45%">반 정보</th>
                        <th style="width: 35%">총 누적 거리</th>
                    </tr>
                </thead>
                <tbody id="rank-table-body">
                    <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>⏱️ 최근 등록된 학생 기록</h2>
            <table>
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>학생 정보</th>
                        <th>거리</th>
                        <th>증빙/관리</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0; color:var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px;">
            📸 증빙 사진 확인
        </h3>
        <p id="modalStudentInfo" style="color: var(--text-muted); font-size: 14px; margin: 0;"></p>
        <img id="modalImg" src="" alt="증빙 이미지">
        <br>
        <button class="close-modal" onclick="closeModal()">닫기</button>
    </div>
</div>

<script>
    // [★가장 중요★] 본인이 배포한 구글 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuMhuLzWVNgsRKsmD7Bn3phc_bEx1N9dHffzXAm3NtC3AT72rqfn30RwxjOEo9iVbCrw/exec'; 

    let runningLogs = [];

    document.getElementById('run-date').value = new Date('2026-06-10').toISOString().substring(0, 10);

    const START_DATE = new Date('2026-06-08');
    const END_DATE = new Date('2026-07-10');

    function previewImage(input) {
        const previewBox = document.getElementById('input-preview-box');
        const previewImg = document.getElementById('input-preview-img');
        const fileLabel = document.getElementById('file-label');
        
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewBox.style.display = 'block';
                fileLabel.innerHTML = '✅ 선택 완료';
                fileLabel.style.backgroundColor = '#065f46';
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            clearImagePreview();
        }
    }

    function clearImagePreview() {
        document.getElementById('input-preview-box').style.display = 'none';
        document.getElementById('input-preview-img').src = '';
        const fileLabel = document.getElementById('file-label');
        fileLabel.innerHTML = '📁 사진 선택';
        fileLabel.style.backgroundColor = 'var(--file-btn)';
    }

    async function loadLogsFromServer() {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=read`);
            if (!response.ok) throw new Error('데이터 불러오기 실패');
            runningLogs = await response.json();
            updateDashboard();
        } catch (error) {
            console.error('에러:', error);
            alert('구글 시트에서 데이터를 불러오지 못했습니다. URL 설정을 확인하세요.');
            // 실패 시 로컬 스토리지 데이터라도 보여줌 (백업용)
            runningLogs = JSON.parse(localStorage.getItem('schoolRunningLogs')) || [];
            updateDashboard();
        }
    }

// 기존 updateDashboard() 함수를 찾아서 이 코드로 교체해 주세요!
function updateDashboard() {
    const logBody = document.getElementById('log-table-body');
    const rankBody = document.getElementById('rank-table-body');
    
    // 데이터가 아예 없거나 배열이 아니면 빈 배열로 초기화
    if (!runningLogs || !Array.isArray(runningLogs)) {
        runningLogs = [];
    }

    const filteredLogs = runningLogs.filter(log => {
        if (!log || !log.date) return false;
        const logDate = new Date(log.date);
        return logDate >= START_DATE && logDate <= END_DATE;
    });
    filteredLogs.sort((a, b) => new Date(b.date) - new Date(a.date));

    logBody.innerHTML = '';
    if(filteredLogs.length === 0) {
        logBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">최근 등록된 기록이 없습니다.</td></tr>`;
    }

    filteredLogs.forEach((log) => {
        // 거리 값이 유효하지 않으면 0으로 처리 (방어 코드)
        let distNum = parseFloat(log.distance);
        if (isNaN(distNum)) distNum = 0;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${log.date ? log.date.substring(5) : ''}</td>
            <td><small style="color:var(--text-muted);">${log.grade || ''} ${log.class || ''}</small><br><strong>${log.name || '무명'}</strong></td>
            <td style="color: var(--accent); font-weight:bold;">${distNum.toFixed(2)} km</td>
            <td>
                ${log.base64Image ? `<button class="action-btn view-btn" onclick="viewImage('${log.rowId}')">보기</button>` : `<span style="color:var(--text-muted); font-size:12px; margin-right:12px;">없음</span>`}
            </td>
        `;
        logBody.appendChild(tr);
    });

    const classTotals = {};
    filteredLogs.forEach(log => {
        const classKey = `${log.grade || '미지정'} ${log.class || '미지정'}`;
        if (!classTotals[classKey]) {
            classTotals[classKey] = 0;
        }
        
        let distNum = parseFloat(log.distance);
        if (isNaN(distNum)) distNum = 0; // 숫자가 아니면 0으로 안전하게 처리
        
        classTotals[classKey] += distNum;
    });

    const sortedClasses = Object.keys(classTotals).map(classKey => ({
        className: classKey,
        total: classTotals[classKey]
    })).sort((a, b) => b.total - a.total);

    rankBody.innerHTML = '';
    if(sortedClasses.length === 0) {
        rankBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">등록된 기록이 없습니다.</td></tr>`;
    }
    
    sortedClasses.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><span class="rank-badge">${index + 1}</span></td>
            <td><strong>${item.className}</strong></td>
            <td style="color: var(--accent); font-weight: bold;">${item.total.toFixed(2)} km</td>
        `;
        rankBody.appendChild(tr);
    });

    localStorage.setItem('schoolRunningLogs', JSON.stringify(runningLogs));
}
    async function addLog() {
        const grade = document.getElementById('student-grade').value;
        const className = document.getElementById('student-class').value;
        const name = document.getElementById('student-name').value.trim();
        const dateInput = document.getElementById('run-date').value;
        const distanceInput = document.getElementById('run-distance').value;
        const fileInput = document.getElementById('proof-image');
        const dateWarn = document.getElementById('date-warn');
        const submitBtn = document.getElementById('submit-btn-el');

        if (!name || !distanceInput || distanceInput <= 0) {
            alert('이름과 거리를 정확하게 입력해주세요!');
            return;
        }

        const inputDate = new Date(dateInput);
        if (inputDate < START_DATE || inputDate > END_DATE || !dateInput) {
            dateWarn.style.display = 'block';
            alert('지정된 챌린지 기간 내의 날짜만 입력 가능합니다.');
            return;
        } else {
            dateWarn.style.display = 'none';
        }

        submitBtn.innerHTML = '⏳ 등록 중...';
        submitBtn.disabled = true;

        let base64Image = '';
        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            base64Image = await new Promise((resolve) => {
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        const payload = {
            action: 'create',
            date: dateInput,
            grade: grade,
            class: className,
            name: name,
            distance: distanceInput,
            base64Image: base64Image
        };

        try {
            // [서버로 데이터 전송 (자동 누적 통합)]
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('등록 실패');
            
            alert(`${name} 학생의 기록이 구글 시트에 등록되었습니다!`);
            
            // 폼 초기화
            document.getElementById('student-name').value = '';
            document.getElementById('run-distance').value = '';
            document.getElementById('proof-image').value = '';
            clearImagePreview();
            
            // 등록 후 즉시 최신 데이터 다시 로드 (실시간 누적 통합 완료)
            await loadLogsFromServer();

        } catch (error) {
            console.error('에러:', error);
            alert('구글 시트에 등록하지 못했습니다. URL 설정을 확인하세요.');
        } finally {
            // [요청반영] '기록 등록하기' 버튼 스타일 및 텍스트 원상복구
            submitBtn.innerHTML = '기록 등록하기';
            submitBtn.disabled = false;
        }
    }

    function viewImage(rowId) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalInfo = document.getElementById('modalStudentInfo');
        
        const log = runningLogs.find(item => item.rowId === rowId);
        if (log && log.base64Image) {
            modalInfo.innerText = `${log.grade} ${log.class} ${log.name} 학생 (${parseFloat(log.distance).toFixed(2)} km)`;
            modalImg.src = log.base64Image;
            modal.style.display = 'flex';
        } else {
            alert('증빙 이미지를 불러올 수 없습니다.');
        }
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    // 화면 로딩 시 구글 시트에서 최신 데이터 가져와서 대시보드 구성
    window.onload = loadLogsFromServer;
</script>
</body>
</html>
